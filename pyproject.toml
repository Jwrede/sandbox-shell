[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-shell"
version = "0.1.0"
description = "Run a shell or command inside the sandbox of a systemd service, also when the service is not running"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jonathan Wrede"}]
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Jwrede/sandbox-shell"

[project.scripts]
sandbox-shell = "sandbox_shell:main"

[tool.setuptools]
py-modules = ["sandbox_shell"]
