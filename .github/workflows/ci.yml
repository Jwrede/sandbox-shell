name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest tests.test_unit -v
      - name: Install and run the entry point
        run: |
          pip install .
          sandbox-shell --version

  integration:
    # Installs throwaway units under /run/systemd/system on the runner and
    # starts commands in their sandboxes (systemd is PID 1 on the runners).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: systemctl --version
      - run: sudo SANDBOX_SHELL_INTEGRATION=1 python3 -m unittest tests.test_integration -v
